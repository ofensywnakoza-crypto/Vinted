<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px; padding: 16px; font-family: -apple-system, sans-serif;
      background: #FAFAFA; margin: 0;
    }
    h2 { color: #09B1BA; margin: 0 0 8px 0; font-size: 18px; }
    p { color: #6B7280; font-size: 13px; margin: 6px 0; }
    .status { padding: 10px; border-radius: 8px; margin-top: 12px; }
    .status.ok { background: #D1FAE5; color: #065F46; }
    .status.err { background: #FEE2E2; color: #991B1B; }
    button {
      background: #09B1BA; color: white; border: none;
      padding: 10px 16px; border-radius: 8px; font-weight: 600;
      cursor: pointer; margin-top: 10px; width: 100%;
    }
  </style>
</head>
<body>
  <h2>Vinted Manager</h2>
  <p>Dane z Vinted sa automatycznie synchronizowane z aplikacja gdy przegladasz swoj profil.</p>
  <div id="status" class="status">Sprawdzam polaczenie z aplikacja...</div>
  <button id="open-app">Otworz aplikacje</button>
  <script src="popup.js"></script>
</body>
</html>
