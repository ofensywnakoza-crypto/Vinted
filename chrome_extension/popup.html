<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinted Cookie Sync</title>
  <style>
    body {
      font-family: sans-serif;
      width: 260px;
      padding: 14px 16px;
      margin: 0;
      background: #f9f9f9;
      color: #222;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #09b1ba;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.ok     { background: #22c55e; }
    .dot.error  { background: #ef4444; }
    .dot.offline{ background: #f59e0b; }
    .dot.unknown{ background: #9ca3af; }
    .label { font-size: 13px; }
    .ts { font-size: 11px; color: #666; margin-top: -4px; margin-bottom: 8px; }
    button {
      width: 100%;
      padding: 7px;
      background: #09b1ba;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #078a92; }
    .note { font-size: 11px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Vinted Cookie Sync</h2>

  <div class="row">
    <div class="dot" id="statusDot"></div>
    <span class="label" id="statusText">Sprawdzam...</span>
  </div>
  <div class="ts" id="lastSync"></div>

  <button id="syncBtn">Synchronizuj teraz</button>

  <p class="note">Ciasteczko jest wysyłane do lokalnego serwera (port 27182) który musi być uruchomiony.</p>

  <script src="popup.js"></script>
</body>
</html>
